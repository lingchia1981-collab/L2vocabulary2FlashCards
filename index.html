
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>華語生詞學習閃卡 - A1詞彙同步版</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f5f7fa;
            --card-width: 380px;
            --card-height: calc(100vh - 160px); 
            --sentence-box-bg: #f0f4f8; 
        }
        * { box-sizing: border-box; }
        body {
            font-family: "標楷體", "BiauKai", "DFKai-SB", "Kaiti", "SimSun", serif;
            background-color: var(--bg-color);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0; overflow: hidden; 
        }
        .container { perspective: 1000px; width: var(--card-width); max-width: 95vw; }
        .flashcard {
            width: 100%; height: var(--card-height); min-height: 500px; 
            position: relative; transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer; box-shadow: 0 10px 40px rgba(0,0,0,0.12); border-radius: 24px;
        }
        .flashcard.flipped { transform: rotateY(180deg); }
        .card-face {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            display: flex; flex-direction: column; align-items: center;
            border-radius: 24px; background: white; padding: 20px 15px; text-align: center; overflow: hidden;
        }
        .card-front { justify-content: center; color: #333; }
        .front-main-text { font-size: 80px; line-height: 1; }
        .audio-icon-front { font-size: 28px; color: var(--primary-color); margin-top: 35px; border: 1px solid var(--primary-color); width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: background 0.2s; }
        .audio-icon-front:hover { background-color: #f0f7ff; }
        
        .card-back { transform: rotateY(180deg); justify-content: flex-start; }
        .word-main { font-size: 32px; color: var(--primary-color); margin-bottom: 2px; }
        
        .pinyin { 
            font-family: "Segoe UI", "Arial", "Lucida Sans Unicode", sans-serif;
            font-size: 20px; 
            color: #1a252f; 
            margin-bottom: 5px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        
        .pos { font-size: 11px; color: #fff; background: #e67e22; padding: 2px 10px; border-radius: 10px; display: inline-block; margin-bottom: 5px; font-weight: bold; }
        .image-display-box { width: 100%; height: 180px; margin: 5px 0; border-radius: 12px; overflow: hidden; background: #fff; display: flex; align-items: center; justify-content: center; border: 1px solid #eee; position: relative; }
        .image-display-box img { width: 100%; height: 100%; object-fit: contain; }
        .prompt-text { position: absolute; font-size: 11px; color: #7f8c8d; padding: 10px; text-align: left; line-height: 1.4; font-family: sans-serif; display: none; overflow-y: auto; height: 100%; background: #fafafa; }
        
        .english-word { font-size: 15px; font-weight: bold; margin: 3px 0; color: #444; font-family: sans-serif; line-height: 1.2; }
        .sentence-box { background: var(--sentence-box-bg); padding: 12px; border-radius: 15px; text-align: left; width: 100%; flex-grow: 1; overflow-y: auto; margin-top: 5px; }
        .sentence-item { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #e0e6ed; }
        .sentence-cn { font-size: 19px; line-height: 1.3; color: #000; font-weight: bold; }
        .sentence-en { font-size: 14px; color: #444; margin-bottom: 3px; font-weight: 500; font-family: sans-serif; }
        
        .sentence-pinyin { 
            font-family: "Segoe UI", "Arial", "Lucida Sans Unicode", sans-serif;
            font-size: 15px; 
            color: #1a252f; 
            font-style: normal;
            font-weight: bold;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }
        
        .controls { margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        button { padding: 10px 18px; font-size: 15px; border-radius: 50px; border: none; background-color: var(--primary-color); color: white; cursor: pointer; font-family: "標楷體"; }
        #randomBtn { background-color: #27ae60; }
        .audio-btn { background: none; color: var(--primary-color); border: 1px solid var(--primary-color); padding: 4px 10px; font-size: 11px; margin: 2px 0; border-radius: 8px; cursor: pointer; }
        .progress { margin-top: 8px; font-size: 13px; color: #777; }
    </style>
</head>
<body>
    <div class="container">
        <div class="flashcard" id="card">
            <div class="card-face card-front" onclick="flipCard()">
                <div class="front-main-text" id="front-text">載入中...</div>
                <div class="audio-icon-front" onclick="event.stopPropagation(); playCurrentWord()">🔊</div>
            </div>
            <div class="card-face card-back" onclick="flipCard()">
                <div class="word-info-top">
                    <div class="word-main" id="back-word">詞</div>
                    <div class="pinyin" id="back-pinyin">pīnyīn</div>
                    <div class="pos" id="back-pos">POS</div>
                    <div><button class="audio-btn" id="word-audio-btn">🔊 Speak Word</button></div>
                </div>
                <div class="image-display-box">
                    <img id="back-img" src="" alt="背面圖片">
                    <div id="prompt-box" class="prompt-text"></div>
                </div>
                <div class="english-word" id="back-en-word">english</div>
                <div class="sentence-box" id="sentence-container"></div>
            </div>
        </div>
    </div>
    <div class="controls">
        <button id="prevBtn" onclick="prevCard()">上一張</button>
        <button id="randomBtn" onclick="shuffleCards()">Shuffle</button>
        <button id="nextBtn" onclick="nextCard()">下一張</button>
    </div>
    <div class="progress" id="progress">1 / 10</div>

    <script>
        let vocabulary = [
            { trad: "伯母", simp: "", pinyin: "bómǔ", pos: "(N)", en: "aunt; here a polite term for a friend’s mother regardless of age", img: "伯母", prompt: "北歐清新水彩插畫風，一位溫柔的中年女性微笑著，背景有淡雅的花草，中央上方是標楷體大字「伯母」", sentences: [{ cn: "伯母，您好！", py: "Bómǔ, nínhǎo!", en: "Hello, aunt!" }] },
            { trad: "您", simp: "", pinyin: "nín", pos: "(N)", en: "you (honorific)", img: "您", prompt: "北歐清新水彩插畫風，一雙帶著敬意遞出茶杯的手，色調溫馨，中央上方是標楷體大字「您」", sentences: [{ cn: "老師，謝謝您。", py: "Lǎoshī, xièxie nín.", en: "Teacher, thank you." }] },
            { trad: "學生", simp: "学生", pinyin: "xuésheng", pos: "(N)", en: "student", img: "學生", prompt: "北歐清新水彩插畫風，一位年輕女學生抱著書本走在校園樹蔭下，中央上方是標楷體大字「學生」", sentences: [{ cn: "她是一位學生。", py: "Tā  shì yí wèi xuésheng.", en: "She is a student." }] },
            { trad: "老師", simp: "老师", pinyin: "lǎoshī", pos: "(N)", en: "teacher", img: "老師", prompt: "北歐清新水彩插畫風，一位溫柔的女老師拿著課本在富士山與櫻花的淡雅背景前微笑，線條柔和，中央上方是標楷體大字「老師」", sentences: [{ cn: "我的老師是日本人。", py: "Wǒ de lǎoshī  shì Rìběnrén.", en: "My teacher is Japanese." }] },
            { trad: "幾", simp: "几", pinyin: "jǐ", pos: "(N)", en: "how many", img: "幾", prompt: "北歐清新水彩插畫風，桌上放著幾個問號形狀的彩色小盆栽，中央上方是標楷體大字「幾」", sentences: [{ cn: "你家有幾個人？", py: "Nǐ jiā yǒu jǐ gè rén?", en: "How many people are there in your family?" }] },
            { trad: "個", simp: "个", pinyin: "ge", pos: "(M)", en: "general measure word", img: "個", prompt: "北歐清新水彩插畫風，溫馨的一家四口手牽手散步，線條柔和，中央上方是標楷體大字「個」", sentences: [{ cn: "我家有四個人。", py: "Wǒ jiā yǒu sì ge rén.", en: "There are four people in my family." }] },
            { trad: "兩", simp: "随", pinyin: "liǎng", pos: "(N)", en: "two", img: "兩", prompt: "北歐清新水彩插畫風，兩個可愛的小女孩正在一起玩耍，畫面溫暖，中央上方是標楷體大字「兩」", sentences: [{ cn: "我有兩個妹妹。", py: "Wǒ yǒu liǎng ge mèimei.", en: "I have two younger sisters." }] },
            { trad: "兄弟", simp: "", pinyin: "xiōngdì", pos: "(N)", en: "brothers", img: "兄弟", prompt: "北歐清新水彩插畫風，兩個男孩勾肩搭背在草地上大笑的背影，中央上方是標楷體大字「兄弟」", sentences: [{ cn: "他們是兄弟。", py: "Tāmen  shì xiōngdì.", en: "They are brothers." }] },
            { trad: "姐妹", simp: "", pinyin: "jiěmèi", pos: "(N)", en: "sisters", img: "姐妹", prompt: "北歐清新水彩插畫風，三個女孩手牽手走在向日葵花海裡，中央上方是標楷體大字「姐妹」", sentences: [{ cn: "我沒有姐妹。", py: "Wǒ méiyǒu jiěmèi.", en: "I don't have sisters." }] },
            { trad: "名字", simp: "", pinyin: "míngzi", pos: "(N)", en: "name", img: "名字", prompt: "北歐清新水彩插畫風，兩個人在溫馨的咖啡廳裡禮貌地交換名片，中央上方是標楷體大字「名字」", sentences: [{ cn: "請問您叫什麼名字？", py: "Qǐngwèn nín jiào shénme míngzi?", en: "May I ask what your name is?" }] }
        ];

        let currentIndex = 0;
        const cardElement = document.getElementById('card');

        function updateCard() {
            const data = vocabulary[currentIndex];
            document.getElementById('front-text').innerText = data.trad;
            
            let backWordText = data.trad;
            if (data.simp && data.simp !== data.trad) backWordText += ` (${data.simp})`;
            document.getElementById('back-word').innerText = backWordText;
            document.getElementById('back-pinyin').innerText = data.pinyin;
            document.getElementById('back-pos').innerText = data.pos; 
            document.getElementById('back-en-word').innerText = data.en;
            
            document.getElementById('word-audio-btn').onclick = (e) => { e.stopPropagation(); playSound(data.trad, data.pinyin); };
            
            const container = document.getElementById('sentence-container');
            container.innerHTML = "";
            data.sentences.forEach(s => {
                const item = document.createElement('div');
                item.className = 'sentence-item';
                item.innerHTML = `
                    <div class="sentence-content">
                        <div class="sentence-en">${s.en}</div>
                        <div class="sentence-cn">${s.cn}</div>
                        <div class="sentence-pinyin">${s.py}</div>
                    </div>
                    <button class="audio-btn" onclick="event.stopPropagation(); playSound('${s.cn}')">🔊 Speak</button>
                `;
                container.appendChild(item);
            });
            
            const backImg = document.getElementById('back-img');
            const promptBox = document.getElementById('prompt-box');
            
            backImg.style.display = "block";
            promptBox.style.display = "none";
            
            backImg.src = `${data.img}.jfif`; 
            
            backImg.onerror = function() { 
                backImg.style.display = "none";
                promptBox.style.display = "block";
                promptBox.innerHTML = `<strong>圖檔載入失敗。提示詞：</strong><br>${data.prompt}`;
            };

            document.getElementById('progress').innerText = `${currentIndex + 1} / ${vocabulary.length}`;
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === vocabulary.length - 1;
            cardElement.classList.remove('flipped');
        }

        function playCurrentWord() {
            const data = vocabulary[currentIndex];
            playSound(data.trad, data.pinyin);
        }

        function shuffleCards() {
            for (let i = vocabulary.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [vocabulary[i], vocabulary[j]] = [vocabulary[j], vocabulary[i]];
            }
            currentIndex = 0;
            updateCard();
        }

        function flipCard() { cardElement.classList.toggle('flipped'); }
        function nextCard() { if (currentIndex < vocabulary.length - 1) { currentIndex++; updateCard(); } }
        function prevCard() { if (currentIndex > 0) { currentIndex--; updateCard(); } }
        
        function playSound(text, pinyin) {
            let speechText = text.replace(/和/g, '漢'); 
            const url = `https://translate.google.com/translate_tts?ie=UTF-8&tl=zh-TW&client=tw-ob&q=${encodeURIComponent(speechText)}`;
            new Audio(url).play();
        }
        
        updateCard();
    </script>
</body>
</html>
